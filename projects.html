<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Projects | Abdul Moiz Portfolio</title>
  <meta name="description" content="Explore all portfolio projects by Abdul Moiz across AI & Automation, Flutter, Game Dev, and Web Dev.">
  <link rel="stylesheet" href="style.css">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Framer Motion CDN -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>

<body class="bg-[#08070d] text-[#f5f6f9] min-h-screen flex flex-col font-sans">

  <!-- Ambient Particles & Glow -->
  <div class="ambient-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>
  <div class="grid-overlay"></div>

  <!-- Header / Nav -->
  <header id="header" class="fixed top-0 left-0 w-full z-50 bg-[#08070d]/80 backdrop-blur-md border-b border-white/10 py-4">
    <div class="container mx-auto px-6 flex items-center justify-between">
      <a href="index.html" class="logo font-mono text-xl font-bold tracking-wider text-white hover:text-[#00E5FF] transition-colors">
        MOIZ.DEV
      </a>
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-medium text-[#9ea4b5] hover:text-[#00E5FF] transition-colors bg-[#1a1928] px-4 py-2 rounded-full border border-white/10 hover:border-[#00E5FF]/40">
        <span>←</span>
        <span>Back to Home</span>
      </a>
    </div>
  </header>

  <!-- Main Showcase Container -->
  <main class="flex-grow pt-32">
    <div class="container mx-auto px-4 max-w-7xl text-center mb-8">
      <span class="inline-block text-xs font-mono font-semibold tracking-wider text-[#00E5FF] uppercase mb-2 px-3.5 py-1 rounded-full bg-[#00E5FF]/10 border border-[#00E5FF]/20 shadow-sm">
        Portfolio Archives
      </span>
      <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-4">
        All Projects Showcase
      </h1>
      <p class="text-[#9ea4b5] max-w-2xl mx-auto text-base md:text-lg">
        Explore my complete collection of projects across AI Automation, Game Development, Flutter Apps, and Web Applications.
      </p>
    </div>

    <!-- React Root Mount -->
    <div id="react-all-projects-root"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 bg-[#08070d]/90 py-8 mt-auto text-center">
    <div class="container mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <a href="index.html" class="logo font-mono text-lg font-bold text-white">MOIZ.DEV</a>
      <p class="text-[#646a78] text-sm">&copy; 2026 Abdul Moiz. All rights reserved. Built with Passion.</p>
    </div>
  </footer>

  <script type="text/babel" type="module" src="./js/allProjectsPage.js"></script>
</body>

</html>
